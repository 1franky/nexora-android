<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Roboto:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Roboto', system-ui, sans-serif; }
    a { color: #3987E5; }
    a:hover { color: #6BA6EE; }
    .num { font-family: 'Space Grotesk', 'Roboto', sans-serif; }
  </style>
</helmet>

<div style="width:390px;height:844px;background:#0B0F1A;position:relative;overflow:hidden;display:flex;flex-direction:column;">

  <!-- Top bar -->
  <div style="padding:26px 20px 4px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
    <div class="num" style="font-size:22px;font-weight:700;color:#F4F6FB;letter-spacing:-0.01em;">Tarjetas</div>
  </div>

  <div style="padding:20px 20px 0;display:flex;flex-direction:column;gap:16px;overflow:hidden;flex:1;">

    <!-- Card 1: BBVA Oro -->
    <div style="border-radius:22px;padding:20px;background:linear-gradient(135deg,#1D3E7C 0%,#16264A 100%);position:relative;overflow:hidden;">
      <div style="position:absolute;top:-30px;right:-20px;width:120px;height:120px;border-radius:60px;background:radial-gradient(circle,rgba(107,166,238,0.25),transparent 70%);"></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;position:relative;">
        <div>
          <div style="font-size:14px;font-weight:600;color:#F4F6FB;">BBVA Oro</div>
          <div style="font-size:12px;color:#9DBFEF;margin-top:2px;">•••• 9911</div>
        </div>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9DBFEF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      </div>
      <div class="num" style="margin-top:22px;font-size:24px;font-weight:700;color:#F4F6FB;letter-spacing:-0.01em;position:relative;">$2,500</div>
      <div style="font-size:12px;color:#9DBFEF;margin-top:2px;position:relative;">Deuda actual</div>

      <div style="margin-top:16px;height:6px;border-radius:3px;background:rgba(255,255,255,0.14);position:relative;overflow:hidden;">
        <div style="width:8%;height:100%;background:#6BA6EE;border-radius:3px;"></div>
      </div>
      <div style="margin-top:8px;display:flex;justify-content:space-between;position:relative;">
        <div style="font-size:11px;color:#9DBFEF;">Disponible $27,500</div>
        <div style="font-size:11px;color:#9DBFEF;">Límite $30,000</div>
      </div>
    </div>

    <!-- Card 2: Santander Free -->
    <div style="border-radius:22px;padding:20px;background:linear-gradient(135deg,#2B2140 0%,#181229 100%);position:relative;overflow:hidden;">
      <div style="position:absolute;top:-30px;right:-20px;width:120px;height:120px;border-radius:60px;background:radial-gradient(circle,rgba(196,159,255,0.2),transparent 70%);"></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;position:relative;">
        <div>
          <div style="font-size:14px;font-weight:600;color:#F4F6FB;">Santander Free</div>
          <div style="font-size:12px;color:#C9B6F0;margin-top:2px;">•••• 4477</div>
        </div>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C9B6F0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      </div>
      <div class="num" style="margin-top:22px;font-size:24px;font-weight:700;color:#F4F6FB;letter-spacing:-0.01em;position:relative;">$1,800</div>
      <div style="font-size:12px;color:#C9B6F0;margin-top:2px;position:relative;">Deuda actual</div>

      <div style="margin-top:16px;height:6px;border-radius:3px;background:rgba(255,255,255,0.14);position:relative;overflow:hidden;">
        <div style="width:12%;height:100%;background:#C9B6F0;border-radius:3px;"></div>
      </div>
      <div style="margin-top:8px;display:flex;justify-content:space-between;position:relative;">
        <div style="font-size:11px;color:#C9B6F0;">Disponible $13,200</div>
        <div style="font-size:11px;color:#C9B6F0;">Límite $15,000</div>
      </div>
    </div>

  </div>

  <!-- FAB -->
  <div style="position:absolute;right:20px;bottom:96px;width:56px;height:56px;border-radius:28px;background:#3987E5;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(57,135,229,0.35);">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B0F1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </div>

  <!-- Bottom nav -->
  <div style="height:76px;background:#0B0F1A;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-around;padding-bottom:12px;flex-shrink:0;">

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:44px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C879E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <div style="font-size:11px;color:#7C879E;">Dashboard</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:44px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C879E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3" cy="6" r="1" fill="#7C879E" stroke="none"/><circle cx="3" cy="12" r="1" fill="#7C879E" stroke="none"/><circle cx="3" cy="18" r="1" fill="#7C879E" stroke="none"/></svg>
      <div style="font-size:11px;color:#7C879E;">Movimientos</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:44px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3987E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      <div style="font-size:11px;font-weight:600;color:#3987E5;">Tarjetas</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:44px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C879E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <div style="font-size:11px;color:#7C879E;">Avisos</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
