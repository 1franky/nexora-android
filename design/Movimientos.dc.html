<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Roboto:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Roboto', system-ui, sans-serif; }
    a { color: #3987E5; }
    a:hover { color: #6BA6EE; }
    .num { font-family: 'Space Grotesk', 'Roboto', sans-serif; }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 20px; }
    .row-icon { width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  </style>
</helmet>

<div style="width:390px;height:844px;background:#0B0F1A;position:relative;overflow:hidden;display:flex;flex-direction:column;">

  <!-- Top bar -->
  <div style="padding:26px 20px 4px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
    <div class="num" style="font-size:22px;font-weight:700;color:#F4F6FB;letter-spacing:-0.01em;">Movimientos</div>
    <div style="width:44px;height:44px;border-radius:22px;background:#141A2B;border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C7CEDC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M7 12h10M10 19h4"/></svg>
    </div>
  </div>

  <!-- Account filter chip -->
  <div style="padding:16px 20px 0;flex-shrink:0;">
    <div style="display:inline-flex;align-items:center;gap:8px;min-height:44px;background:#141A2B;border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:0 16px;">
      <span style="font-size:13px;color:#F4F6FB;">Todas las cuentas</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7C879E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
  </div>

  <!-- List -->
  <div style="padding-top:14px;flex:1;overflow:hidden;">

    <div style="padding:0 20px 6px;font-size:12px;font-weight:600;color:#7C879E;letter-spacing:.04em;">HOY</div>

    <div class="row">
      <div class="row-icon" style="background:rgba(52,211,153,0.14);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;color:#F4F6FB;">Nómina</div>
        <div style="font-size:12px;color:#7C879E;margin-top:1px;">Débito Principal</div>
      </div>
      <div class="num" style="font-size:15px;font-weight:700;color:#34D399;">+$15,000</div>
    </div>

    <div class="row">
      <div class="row-icon" style="background:rgba(248,113,113,0.14);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;color:#F4F6FB;">Amazon</div>
        <div style="font-size:12px;color:#7C879E;margin-top:1px;">BBVA Oro · Compras</div>
      </div>
      <div class="num" style="font-size:15px;font-weight:700;color:#F87171;">-$2,500</div>
    </div>

    <div style="padding:16px 20px 6px;font-size:12px;font-weight:600;color:#7C879E;letter-spacing:.04em;">AYER</div>

    <div class="row">
      <div class="row-icon" style="background:rgba(248,113,113,0.14);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;color:#F4F6FB;">Restaurante</div>
        <div style="font-size:12px;color:#7C879E;margin-top:1px;">Débito Principal · Restaurantes</div>
      </div>
      <div class="num" style="font-size:15px;font-weight:700;color:#F87171;">-$320</div>
    </div>

    <div class="row">
      <div class="row-icon" style="background:rgba(107,166,238,0.14);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6BA6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;color:#F4F6FB;">Transferencia</div>
        <div style="font-size:12px;color:#7C879E;margin-top:1px;">Débito Principal → Ahorro</div>
      </div>
      <div class="num" style="font-size:15px;font-weight:700;color:#F4F6FB;">$1,000</div>
    </div>

  </div>

  <!-- FAB -->
  <div style="position:absolute;right:20px;bottom:96px;width:56px;height:56px;border-radius:28px;background:#3987E5;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(57,135,229,0.35);">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B0F1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </div>

  <!-- Bottom nav -->
  <div style="height:76px;background:#0B0F1A;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-around;padding-bottom:12px;flex-shrink:0;">

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:44px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C879E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <div style="font-size:11px;color:#7C879E;">Dashboard</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:44px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3987E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3" cy="6" r="1" fill="#3987E5" stroke="none"/><circle cx="3" cy="12" r="1" fill="#3987E5" stroke="none"/><circle cx="3" cy="18" r="1" fill="#3987E5" stroke="none"/></svg>
      <div style="font-size:11px;font-weight:600;color:#3987E5;">Movimientos</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:44px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C879E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      <div style="font-size:11px;color:#7C879E;">Tarjetas</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:44px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C879E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <div style="font-size:11px;color:#7C879E;">Avisos</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
