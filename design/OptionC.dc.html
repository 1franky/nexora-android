<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Roboto:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Roboto', system-ui, sans-serif; }
    a { color: #1565C0; }
    a:hover { color: #0D47A1; }
    .heading { font-family: 'Nunito', 'Roboto', sans-serif; }
    .pill-btn { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 7px; width: 62px; }
  </style>
</helmet>

<div style="width:390px;height:844px;background:#FCFCFB;position:relative;overflow:hidden;display:flex;flex-direction:column;">

  <!-- Top bar -->
  <div style="padding:26px 20px 4px;display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0;">
    <div>
      <div style="font-size:13px;color:#898781;margin-bottom:3px;">Hola,</div>
      <div class="heading" style="font-size:22px;font-weight:800;color:#0B0B0B;">Francisco</div>
    </div>
    <div style="width:44px;height:44px;border-radius:22px;background:#F1F0ED;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#52514E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <div style="position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:5px;background:#D6693F;border:2px solid #FCFCFB;"></div>
    </div>
  </div>

  <!-- Stat cards: color-coded, soft -->
  <div style="padding:20px 20px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;flex-shrink:0;">

    <div style="background:#E4EFE3;border-radius:22px;padding:17px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
      <div style="margin-top:12px;font-size:13px;color:#2E7D32;">Disponible</div>
      <div class="heading" style="margin-top:2px;font-size:20px;font-weight:800;color:#1E4620;">$15,000</div>
    </div>

    <div style="background:#F6E4DD;border-radius:22px;padding:17px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B65A36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="17" cy="15" r="1.2" fill="#B65A36" stroke="none"/></svg>
      <div style="margin-top:12px;font-size:13px;color:#B65A36;">Deuda</div>
      <div class="heading" style="margin-top:2px;font-size:20px;font-weight:800;color:#7A3B21;">$8,500</div>
    </div>

    <div style="background:#F1F0ED;border-radius:22px;padding:17px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#52514E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/><path d="M8 2v4M16 2v4"/></svg>
      <div style="margin-top:12px;font-size:13px;color:#52514E;">Próximo pago</div>
      <div style="margin-top:2px;font-size:13px;font-weight:600;color:#0B0B0B;">BBVA</div>
      <div class="heading" style="font-size:16px;font-weight:800;color:#0B0B0B;">$4,850</div>
    </div>

    <div style="background:#F1F0ED;border-radius:22px;padding:17px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#52514E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 7-8"/><path d="M15 7h5v5"/></svg>
      <div style="margin-top:12px;font-size:13px;color:#52514E;">Gastos del mes</div>
      <div class="heading" style="margin-top:2px;font-size:20px;font-weight:800;color:#0B0B0B;">$18,300</div>
    </div>

  </div>

  <!-- Quick actions: friendly pills -->
  <div style="padding:22px 20px 0;flex-shrink:0;">
    <div class="heading" style="font-size:14px;font-weight:700;color:#0B0B0B;margin-bottom:12px;">Acciones rápidas</div>
    <div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:2px;">

      <div class="pill-btn">
        <div style="width:54px;height:54px;border-radius:27px;background:#2A78D6;display:flex;align-items:center;justify-content:center;">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        </div>
        <div style="font-size:11px;color:#52514E;text-align:center;">Ingreso</div>
      </div>

      <div class="pill-btn">
        <div style="width:54px;height:54px;border-radius:27px;background:#F1F0ED;display:flex;align-items:center;justify-content:center;">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#0B0B0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </div>
        <div style="font-size:11px;color:#52514E;text-align:center;">Gasto</div>
      </div>

      <div class="pill-btn">
        <div style="width:54px;height:54px;border-radius:27px;background:#F1F0ED;display:flex;align-items:center;justify-content:center;">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#0B0B0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>
        </div>
        <div style="font-size:11px;color:#52514E;text-align:center;">Transferir</div>
      </div>

      <div class="pill-btn">
        <div style="width:54px;height:54px;border-radius:27px;background:#F1F0ED;display:flex;align-items:center;justify-content:center;">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#0B0B0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        </div>
        <div style="font-size:11px;color:#52514E;text-align:center;">Compra</div>
      </div>

      <div class="pill-btn">
        <div style="width:54px;height:54px;border-radius:27px;background:#F1F0ED;display:flex;align-items:center;justify-content:center;">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#0B0B0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M14 16l2 2 4-4"/></svg>
        </div>
        <div style="font-size:11px;color:#52514E;text-align:center;">Pagar</div>
      </div>

    </div>
  </div>

  <div style="flex:1;"></div>

  <!-- Bottom nav -->
  <div style="height:78px;background:#FCFCFB;border-top:1px solid #E1E0D9;display:flex;align-items:center;justify-content:space-around;padding-bottom:14px;flex-shrink:0;">

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:44px;">
      <div style="width:52px;height:26px;border-radius:13px;background:#DCEADB;display:flex;align-items:center;justify-content:center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </div>
      <div style="font-size:11px;font-weight:700;color:#2E7D32;">Dashboard</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:44px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#898781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin:3.5px 0;"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3" cy="6" r="1" fill="#898781" stroke="none"/><circle cx="3" cy="12" r="1" fill="#898781" stroke="none"/><circle cx="3" cy="18" r="1" fill="#898781" stroke="none"/></svg>
      <div style="font-size:11px;color:#898781;">Movimientos</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:44px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#898781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin:3.5px 0;"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      <div style="font-size:11px;color:#898781;">Tarjetas</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:44px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#898781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin:3.5px 0;"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <div style="font-size:11px;color:#898781;">Avisos</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
