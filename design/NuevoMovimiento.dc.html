<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Roboto:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Roboto', system-ui, sans-serif; }
    a { color: #6BA6EE; }
    a:hover { color: #9DBFEF; }
    .num { font-family: 'Space Grotesk', 'Roboto', sans-serif; }
    .field { background: #141A2B; border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 14px 16px; }
    .field-label { font-size: 12px; color: #7C879E; margin-bottom: 3px; }
    .field-value { font-size: 15px; color: #F4F6FB; }
    .seg { flex: 1; text-align: center; padding: 10px 0; border-radius: 10px; font-size: 13px; font-weight: 600; }
  </style>
</helmet>

<div style="width:390px;height:844px;background:#0B0F1A;position:relative;overflow:hidden;">

  <!-- Dimmed background: Movimientos list (context) -->
  <div style="position:absolute;inset:0;opacity:0.35;">
    <div style="padding:26px 20px 4px;">
      <div class="num" style="font-size:22px;font-weight:700;color:#F4F6FB;">Movimientos</div>
    </div>
    <div style="padding:24px 20px 0;">
      <div style="height:14px;width:120px;background:#141A2B;border-radius:4px;margin-bottom:14px;"></div>
      <div style="height:56px;background:#141A2B;border-radius:14px;margin-bottom:10px;"></div>
      <div style="height:56px;background:#141A2B;border-radius:14px;margin-bottom:10px;"></div>
      <div style="height:56px;background:#141A2B;border-radius:14px;"></div>
    </div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(0,0,0,0.55);"></div>

  <!-- Bottom sheet -->
  <div style="position:absolute;left:0;right:0;bottom:0;background:#111725;border-radius:28px 28px 0 0;padding:12px 20px 28px;box-shadow:0 -12px 32px rgba(0,0,0,0.4);">

    <div style="width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,0.16);margin:0 auto 18px;"></div>

    <div class="num" style="font-size:18px;font-weight:700;color:#F4F6FB;margin-bottom:16px;">Nuevo movimiento</div>

    <!-- Segmented control -->
    <div style="display:flex;gap:6px;background:#0B0F1A;border-radius:12px;padding:4px;margin-bottom:16px;">
      <div class="seg" style="background:#3987E5;color:#0B0F1A;">Gasto</div>
      <div class="seg" style="color:#7C879E;">Ingreso</div>
      <div class="seg" style="color:#7C879E;">Transferir</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;">

      <div class="field">
        <div class="field-label">Monto</div>
        <div class="num" style="font-size:22px;font-weight:700;color:#F4F6FB;">$320.00</div>
      </div>

      <div style="display:flex;gap:12px;">
        <div class="field" style="flex:1;">
          <div class="field-label">Cuenta</div>
          <div class="field-value">Débito Principal</div>
        </div>
        <div class="field" style="flex:1;">
          <div class="field-label">Fecha</div>
          <div class="field-value">29 ago</div>
        </div>
      </div>

      <div class="field">
        <div class="field-label">Categoría</div>
        <div class="field-value">Restaurantes</div>
      </div>

      <div class="field">
        <div class="field-label">Descripción (opcional)</div>
        <div style="font-size:14px;color:#4C5468;">Añade una nota…</div>
      </div>

      <div style="height:52px;border-radius:14px;background:#3987E5;display:flex;align-items:center;justify-content:center;margin-top:4px;">
        <div style="font-size:15px;font-weight:700;color:#0B0F1A;">Guardar</div>
      </div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
