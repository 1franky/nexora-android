<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Roboto:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Roboto', system-ui, sans-serif; }
    a { color: #3987E5; }
    a:hover { color: #6BA6EE; }
    .num { font-family: 'Space Grotesk', 'Roboto', sans-serif; }
    .action-btn { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 7px; width: 60px; }
  </style>
</helmet>

<div style="width:390px;height:844px;background:#0B0F1A;position:relative;overflow:hidden;display:flex;flex-direction:column;">

  <!-- Top bar -->
  <div style="padding:26px 20px 4px;display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0;">
    <div>
      <div style="font-size:13px;color:#7C879E;margin-bottom:3px;">Hola,</div>
      <div class="num" style="font-size:21px;font-weight:700;color:#F4F6FB;letter-spacing:-0.01em;">Francisco</div>
    </div>
    <div style="width:44px;height:44px;border-radius:22px;background:#141A2B;border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C7CEDC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <div style="position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:5px;background:#FF6B4A;border:2px solid #141A2B;"></div>
    </div>
  </div>

  <!-- Stat cards 2x2 -->
  <div style="padding:20px 20px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;flex-shrink:0;">

    <div style="background:#16264A;border:1px solid rgba(57,135,229,0.3);border-radius:20px;padding:16px;position:relative;overflow:hidden;">
      <div style="position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50px;background:radial-gradient(circle,rgba(57,135,229,0.3),transparent 70%);"></div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6BA6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:relative;"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
      <div style="margin-top:12px;font-size:12px;color:#9DBFEF;position:relative;">Disponible</div>
      <div class="num" style="margin-top:2px;font-size:20px;font-weight:700;color:#F4F6FB;letter-spacing:-0.01em;position:relative;">$15,000</div>
    </div>

    <div style="background:#141A2B;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:16px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C879E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="17" cy="15" r="1.2" fill="#7C879E" stroke="none"/></svg>
      <div style="margin-top:12px;font-size:12px;color:#7C879E;">Deuda</div>
      <div class="num" style="margin-top:2px;font-size:20px;font-weight:700;color:#F4F6FB;letter-spacing:-0.01em;">$8,500</div>
    </div>

    <div style="background:#141A2B;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:16px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C879E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/><path d="M8 2v4M16 2v4"/></svg>
      <div style="margin-top:12px;font-size:12px;color:#7C879E;">Próximo pago</div>
      <div style="margin-top:2px;font-size:14px;font-weight:600;color:#F4F6FB;">BBVA</div>
      <div class="num" style="font-size:16px;font-weight:700;color:#F4F6FB;">$4,850</div>
    </div>

    <div style="background:#141A2B;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:16px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C879E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 7-8"/><path d="M15 7h5v5"/></svg>
      <div style="margin-top:12px;font-size:12px;color:#7C879E;">Gastos del mes</div>
      <div class="num" style="margin-top:2px;font-size:20px;font-weight:700;color:#F4F6FB;letter-spacing:-0.01em;">$18,300</div>
    </div>

  </div>

  <!-- Quick actions: circular, Cash-App style -->
  <div style="padding:22px 20px 0;flex-shrink:0;">
    <div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:2px;">

      <div class="action-btn">
        <div style="width:52px;height:52px;border-radius:26px;background:#3987E5;display:flex;align-items:center;justify-content:center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B0F1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        </div>
        <div style="font-size:11px;color:#A9B2C3;text-align:center;">Ingreso</div>
      </div>

      <div class="action-btn">
        <div style="width:52px;height:52px;border-radius:26px;background:#1B2338;border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4F6FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </div>
        <div style="font-size:11px;color:#A9B2C3;text-align:center;">Gasto</div>
      </div>

      <div class="action-btn">
        <div style="width:52px;height:52px;border-radius:26px;background:#1B2338;border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4F6FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>
        </div>
        <div style="font-size:11px;color:#A9B2C3;text-align:center;">Transferir</div>
      </div>

      <div class="action-btn">
        <div style="width:52px;height:52px;border-radius:26px;background:#1B2338;border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4F6FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        </div>
        <div style="font-size:11px;color:#A9B2C3;text-align:center;">Compra</div>
      </div>

      <div class="action-btn">
        <div style="width:52px;height:52px;border-radius:26px;background:#1B2338;border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4F6FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M14 16l2 2 4-4"/></svg>
        </div>
        <div style="font-size:11px;color:#A9B2C3;text-align:center;">Pagar</div>
      </div>

    </div>
  </div>

  <div style="flex:1;"></div>

  <!-- Bottom nav -->
  <div style="height:76px;background:#0B0F1A;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-around;padding-bottom:12px;flex-shrink:0;">

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:44px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3987E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <div style="font-size:11px;font-weight:600;color:#3987E5;">Dashboard</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:44px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C879E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3" cy="6" r="1" fill="#7C879E" stroke="none"/><circle cx="3" cy="12" r="1" fill="#7C879E" stroke="none"/><circle cx="3" cy="18" r="1" fill="#7C879E" stroke="none"/></svg>
      <div style="font-size:11px;color:#7C879E;">Movimientos</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:44px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C879E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      <div style="font-size:11px;color:#7C879E;">Tarjetas</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:44px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C879E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <div style="font-size:11px;color:#7C879E;">Avisos</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
