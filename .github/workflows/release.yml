name: Release

# Solo tags de release real: v1.0.0, v1.2.3... Los tags "vX.Y.Z-debug" de
# releases manuales anteriores (sin firma de producción) no disparan esto.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cachear dependencias de Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Correr tests unitarios
        run: ./gradlew testDebugUnitTest

      - name: Decodificar el keystore de release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Compilar y firmar el APK de release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Borrar el keystore decodificado
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Publicar el release en GitHub con el APK firmado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          apk="app/build/outputs/apk/release/app-release.apk"
          renamed="nexora-android-${tag}.apk"
          mv "$apk" "$renamed"
          gh release create "$tag" "$renamed" \
            --title "$tag" \
            --generate-notes
